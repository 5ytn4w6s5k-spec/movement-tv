name: Build Firestick app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Project updates can be uploaded as a single project.zip through the
      # GitHub website; unpack it into the repo before building. Changes to this
      # workflow file itself have to be uploaded directly, since the build isn't
      # allowed to edit workflow files.
      - name: Unpack uploaded project
        if: hashFiles('project.zip') != ''
        run: |
          unzip -o -q project.zip -d . -x '.github/*'
          git rm -q project.zip
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git add -A
          git commit -q -m "Update app files"
          git push

      - name: Check for the app
        id: check
        run: |
          if [ -f app/build.gradle ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "Nothing to build yet."; fi

      - uses: actions/setup-java@v4
        if: steps.check.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        if: steps.check.outputs.ready == 'true'
        with:
          gradle-version: '8.9'

      - name: Build the app
        if: steps.check.outputs.ready == 'true'
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Name the file
        if: steps.check.outputs.ready == 'true'
        run: cp app/build/outputs/apk/release/app-release.apk MovementSkool.apk

      - name: Package the Chrome extension
        if: steps.check.outputs.ready == 'true'
        run: |
          rm -rf MovementSkool-Chrome
          cp -r chrome-extension MovementSkool-Chrome
          rm -f MovementSkool-Chrome/README.md
          cp app/src/main/assets/web/app.js MovementSkool-Chrome/
          mkdir -p MovementSkool-Chrome/fonts
          cp app/src/main/assets/web/fonts/archivo.woff2 MovementSkool-Chrome/fonts/
          # The extension loads the font itself, so drop the page-relative @font-face rule.
          sed '/^@font-face {/,/^}/d' app/src/main/assets/web/app.css > MovementSkool-Chrome/app.css
          zip -q -r MovementSkool-Chrome.zip MovementSkool-Chrome

      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.ready == 'true'
        with:
          name: MovementSkool
          path: |
            MovementSkool.apk
            MovementSkool-Chrome.zip

      - name: Publish as the latest download
        if: steps.check.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest MovementSkool.apk MovementSkool-Chrome.zip \
            --title "Movement Skool for Firestick" \
            --notes "Build ${{ github.run_number }}" \
            --latest
